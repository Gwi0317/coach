/* Fonte et magnésie pour les surfaces ; les couleurs sont celles des disques
   de compétition et portent toujours le même sens :
   rouge = musculation, bleu = course, jaune = repos, vert = fait. */
:root{
--fonte:#1C2024;--fonte2:#272D33;--fonte3:#3A424A;--clair:#F3F5F4;--clair2:#AAB2B9;
--craie:#ECEEED;--carte:#fff;--creux:#F5F6F6;--encre:#15191C;--encre2:#454E56;--acier:#68717A;--trait:#DCE0E2;
--rouge:#D92D20;--bleu:#2F6FDB;--jaune:#F5B700;--vert:#178A4B;--orange:#B45309;
--vert-p:#E2F3E9;--orange-p:#FBEEDA;
--d:"Big Shoulders","Arial Narrow","Helvetica Neue",sans-serif}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--fonte)}
body{margin:0;min-height:100vh;background:var(--craie);color:var(--encre);
font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
b,h1,h2,h3,h4{font-weight:650}
p{margin:0}
i{font-style:normal}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,[data-act]:focus-visible{outline:2px solid var(--bleu);outline-offset:2px}
.grow{flex:1;min-width:0}

/* ── en-tête : la semaine ───────────────────────────────────────── */
header{position:sticky;top:0;z-index:9;background:var(--fonte);color:var(--clair);
padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:560px;margin:0 auto}
.days button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 0 7px;border-radius:12px;
font-size:13px;font-weight:600;line-height:1;color:var(--clair2)}
.days button.auj{color:#fff}
.days button.on{background:var(--clair);color:var(--fonte)}
.days i{width:14px;height:3px;border-radius:2px;background:transparent}
.days i.gym{background:#7E8891}
.days i.run{background:var(--bleu)}
.days i.ok{background:#35C07A}
.days button.on i.gym{background:#9AA3AA}
.days button.miss{text-decoration:line-through}
.titre{font:800 24px/1.5 var(--d);max-width:560px;margin:0 auto;padding:0 6px}

main{padding:0 16px 16px;max-width:560px;margin:0 auto}
h2{font-size:13px;color:var(--acier);margin:24px 2px 8px;font-weight:600}
h3{font-size:15px;margin:0 0 8px}

/* ── le bloc sombre : ce qu'il y a à faire ──────────────────────── */
.heros{margin:0 -16px 16px;padding:8px 22px 22px;background:var(--fonte);color:var(--clair);border-radius:0 0 26px 26px}
.heros .sur{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--clair2);margin-bottom:4px}
.heros.gym .sur::before,.heros.run .sur::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rouge)}
.heros.run .sur::before{background:var(--bleu)}
.heros h1{font:800 40px/1 var(--d);margin:0;letter-spacing:.005em}
.heros h1 i{font-size:.42em;margin-left:5px;color:var(--clair2)}
.heros .sous{font-size:13.5px;color:#C9CFD3;margin-top:9px;max-width:36em}
.avance{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:16px}
.avance span{font-size:12.5px;color:var(--clair2);white-space:nowrap;font-variant-numeric:tabular-nums}
.avance span:empty{display:none}
.jauge{flex:1;height:6px;border-radius:3px;background:var(--fonte3);overflow:hidden}
.jauge i{display:block;height:100%;border-radius:3px;background:#35C07A;transition:width .3s ease}
.paire{display:flex;gap:30px;margin-top:16px}
.paire small{display:block;font-size:12px;color:var(--clair2)}
.paire b{font:800 24px/1.2 var(--d)}
.paire b i{font-size:13px;color:var(--clair2);margin-left:3px}
.heros.run h1,.heros.poids h1{font-size:68px}
.heros.chrono{text-align:center;padding-bottom:26px}
.heros.chrono .sur{justify-content:center}
.heros.chrono h1{font-size:112px;line-height:.95;font-variant-numeric:tabular-nums;margin-top:2px}
.heros.chrono.tourne h1{color:var(--jaune)}
.heros.chrono.pause h1{color:var(--clair2)}
.heros.chrono.fini h1{color:#35C07A}
.heros.chrono .sous{margin:8px auto 0}
.heros.chrono .jauge{margin-top:18px;flex:none}
.heros.chrono .jauge i{background:var(--jaune);transition:width .25s linear}

/* ── surfaces ───────────────────────────────────────────────────── */
.carte{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:14px;margin-bottom:10px}
.carte.liste{padding:2px 14px}
.note{font-size:13px;color:var(--encre2);border-left:3px solid #C2C8CC;padding:1px 0 1px 12px;margin:2px 2px 14px}
.note.warn{border-color:var(--orange)}
.small{font-size:12.5px;color:var(--acier);margin-top:10px}
.carte>.small:first-child{margin-top:0;margin-bottom:8px}
.vide{font-size:13.5px;color:var(--acier);padding:6px 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14px;color:var(--encre2)}
.row b{color:var(--encre)}
.row .step{flex:none;width:176px}
.row.tot{border-top:1px solid var(--trait);margin-top:6px;padding-top:12px}
.row.tot b{font:800 26px/1 var(--d)}
.row.tot b i{font-size:13px;color:var(--acier);margin-left:3px}
.row input[type=date]{border:1px solid var(--trait);border-radius:10px;background:var(--carte);font:inherit;
font-size:14px;padding:8px 10px;color:var(--encre);min-width:150px}

/* ── boutons ────────────────────────────────────────────────────── */
.cta{display:block;width:100%;margin-top:12px;padding:14px;border-radius:12px;background:var(--fonte);color:#fff;
font-size:15px;font-weight:650}
.cta:active{background:#000}
.ghost{display:block;width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--trait);
color:var(--encre2);font-size:13.5px;font-weight:600;background:var(--carte)}
.ghost.danger{color:var(--rouge);border-color:#EFC6C1}
.lien{display:block;margin:10px auto 0;padding:8px;font-size:12.5px;color:var(--acier);text-decoration:underline}
.outils{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.outils::-webkit-scrollbar{display:none}
.puce{flex:none;padding:9px 14px;border-radius:99px;border:1px solid var(--trait);background:var(--carte);
font-size:13px;font-weight:600;color:var(--encre2);white-space:nowrap}
.puce.on{background:var(--fonte);border-color:var(--fonte);color:#fff}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces .puce{white-space:normal;text-align:left}
.tog{flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:600;color:var(--encre2)}
.extabs{display:flex;gap:2px;padding:3px;background:#E3E6E7;border-radius:13px;margin-bottom:14px}
.extabs .tog.on{background:var(--carte);color:var(--encre);box-shadow:0 1px 2px rgba(21,25,28,.14)}
.trio{display:flex;gap:8px}
.trio .tog,.chpre .tog,.phases .tog{background:var(--carte);border:1px solid var(--trait);border-radius:12px}
.trio .tog{padding:15px 6px;font-size:14px}
.chpre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chpre .tog{padding:15px 0;font:800 23px/1 var(--d);color:var(--encre);font-variant-numeric:tabular-nums}
.chpre .tog.on{background:var(--jaune);border-color:var(--jaune)}
.phases{display:flex;gap:8px}
.phases .tog{display:flex;flex-direction:column;align-items:center;gap:2px;padding:11px 4px}
.phases .tog b{font-size:13.5px;color:var(--encre)}
.phases .tog i{font-size:11.5px;color:var(--acier);font-weight:500}
.phases .tog.on{background:var(--fonte);border-color:var(--fonte)}
.phases .tog.on b{color:#fff}
.phases .tog.on i{color:var(--clair2)}

/* ── un exercice ────────────────────────────────────────────────── */
.exo{background:var(--carte);border:1px solid var(--trait);border-radius:16px;margin-bottom:8px;overflow:hidden}
.exo.open{border-color:#AEB6BC}
.exhead{display:flex;align-items:center;gap:12px;padding:13px 14px 5px;cursor:pointer}
.idx{flex:none;width:26px;height:26px;border-radius:50%;background:#E9ECED;color:var(--acier);
font-size:12.5px;font-weight:700;display:grid;place-items:center}
.exo.fait .idx{background:var(--vert);color:#fff}
.exhead b{display:block;font-size:15px;line-height:1.25}
.exhead small{display:block;font-size:12.5px;color:var(--acier);margin-top:2px}
.exhead small i{margin-left:10px}
.kg{flex:none;text-align:right;font:800 30px/1 var(--d);white-space:nowrap;font-variant-numeric:tabular-nums}
.kg i{font-size:14px;color:var(--acier);margin-left:2px}
.kg small{display:block;font:600 11.5px/1 -apple-system,system-ui,sans-serif;color:var(--acier);margin-top:4px}
.kg small.ok{color:var(--vert)}
.obj{display:flex;flex-wrap:wrap;gap:1px 14px;padding:2px 14px 12px 52px;font-size:12.5px;color:var(--acier)}
.obj b{color:var(--encre2)}
.exedit{display:flex;gap:6px;flex:none}
.exedit button{width:38px;height:38px;border:1px solid var(--trait);border-radius:10px;color:var(--encre2);font-size:15px}
.exo:has(.exedit) .exhead{padding-bottom:13px}
.exbody{padding:14px;border-top:1px solid var(--trait);background:var(--creux)}
.cue{font-size:13.5px;color:var(--encre2);background:var(--carte);border:1px solid var(--trait);border-radius:12px;
padding:10px 12px;margin-bottom:12px}
.vars{margin-bottom:14px}
.vars small{display:block;font-size:12px;color:var(--acier);margin-bottom:6px}
.sets{display:grid;gap:8px}
.set{display:flex;align-items:center;gap:8px}
.set .x{color:var(--acier);font-size:13px;flex:none}
.setcb{flex:none;width:46px;height:46px;border-radius:14px;border:1.5px solid #C3C9CD;background:var(--carte);
font:800 21px/1 var(--d);color:var(--encre2);transition:background .15s,border-color .15s,transform .15s}
.setcb.on{background:var(--vert);border-color:var(--vert);color:#fff;font:700 18px/1 system-ui,sans-serif}
.setcb:active{transform:scale(.92)}
.set.fait .step{opacity:.55}
.step{flex:1;min-width:0;display:flex;align-items:center;height:46px;border:1px solid var(--trait);border-radius:12px;
background:var(--carte);overflow:hidden}
.step button{flex:none;width:36px;height:100%;font-size:21px;line-height:1;color:var(--acier)}
.step button:active{background:var(--creux)}
.step .qty{flex:1;min-width:0;width:100%;border:0;background:none;text-align:center;font:800 23px/1 var(--d);color:var(--encre);
padding:0;margin:0;-moz-appearance:textfield;appearance:textfield;font-variant-numeric:tabular-nums;border-radius:0}
.step .qty::-webkit-outer-spin-button,.step .qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .un{flex:none;font-size:11.5px;color:var(--acier);margin:0 1px 0 -3px}
.rz{font-size:12.5px;color:var(--acier);margin-top:12px;text-align:center}
.rz button{font-size:12.5px;text-decoration:underline;color:var(--encre2);padding:6px}

/* ── état, chiffres, graphiques ─────────────────────────────────── */
.etat{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:12px;
margin-bottom:12px;background:#E6E9EA;color:var(--encre2)}
.etat i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--acier);margin-top:6px}
.etat b{color:inherit}
.etat.ok{background:var(--vert-p);color:#0D5730}
.etat.ok i{background:var(--vert)}
.etat.warn{background:var(--orange-p);color:#74380A}
.etat.warn i{background:var(--orange)}
.cta+.etat,.row+.etat{margin:12px 0 0}
.tuiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tuiles div{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:9px 10px 8px;min-width:0}
.tuiles small{display:block;font-size:11.5px;color:var(--acier);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tuiles b{display:block;font:800 25px/1.15 var(--d);font-variant-numeric:tabular-nums;white-space:nowrap}
.tuiles b i{font-size:13px;color:var(--acier);margin-left:2px}
.bilan .tuiles div{background:var(--creux);border-color:transparent}
.grafbox{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:10px 10px 8px;margin-bottom:12px}
.carte .grafbox{border:0;padding:0;margin:0}
.lect{font-size:13px;color:var(--encre2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.lect b{color:var(--encre);margin-right:8px}
.graf{display:block;width:100%;height:auto;overflow:visible;-webkit-user-select:none;user-select:none}
.graf .gr{stroke:#E4E7E9;stroke-width:1}
.graf .ax{font-size:10px;fill:var(--acier);font-variant-numeric:tabular-nums}
.graf .tit{font-size:10.5px;fill:var(--encre2);font-weight:600}
.graf .ln{fill:none;stroke:var(--fonte);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.graf .ln.fin{stroke:#8A939B;stroke-width:1.5}
.graf .pt{fill:var(--fonte);stroke:var(--carte);stroke-width:2}
.graf .pt.sel{fill:var(--rouge)}
.graf .rp{fill:#98A1A8}
.graf .bande{fill:var(--vert);opacity:.13}
.graf .rep{stroke:#C2C8CC;stroke-width:1}
.graf .evt{fill:var(--fonte);opacity:.09}
.graf .hit{fill:transparent;cursor:pointer}
.grafpied{font-size:11.5px;color:var(--acier);margin-top:6px}
.hist{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.hist th{text-align:left;font-size:11.5px;font-weight:600;color:var(--acier);padding:4px 4px 6px}
.hist td{padding:8px 4px;border-top:1px solid var(--trait);vertical-align:top}
.hist td:first-child{color:var(--acier);white-space:nowrap}
.hist td:nth-child(2){white-space:nowrap}

/* ── technique : muscles, consignes ─────────────────────────────── */
.anatbox{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:12px 12px 8px;margin-bottom:12px}
.anat{display:block;width:100%;max-width:250px;margin:0 auto;height:auto}
.anat .sil path{fill:#E3E6E8;stroke:#C3C9CD;stroke-width:.9}
.anat .axe{fill:#E3E6E8}
.anat .mu{fill:url(#gRepos);stroke:#B9C0C5;stroke-width:.6}
.anat .mu.s{fill:url(#gSec);stroke:#D9766B}
.anat .mu.p{fill:url(#gPrim);stroke:#9E1F15;stroke-width:.7}
.anat .fib{fill:none;stroke:#858E96;stroke-width:.65;stroke-opacity:.3;stroke-linecap:round}
.anat .mu.s+g .fib{stroke:#9A3F35;stroke-opacity:.42}
.anat .mu.p+g .fib{stroke:#6E120B;stroke-opacity:.5;stroke-width:.75}
.anatvue{display:flex;max-width:250px;margin:2px auto 4px}
.anatvue span{flex:1;text-align:center;font-size:11px;color:var(--acier)}
.anatleg{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--encre2);margin:6px 0 2px;line-height:1.4}
.anatleg b{color:var(--encre);margin-right:2px;flex:none}
.anatleg .d{width:9px;height:9px;border-radius:3px;flex:none;position:relative;top:1px}
.anatleg .d.p{background:var(--rouge)}.anatleg .d.s{background:#EE9A91}
.fiche h4{font-size:13px;margin:14px 0 6px}
.fiche ol{margin:0;padding-left:20px}
.fiche li{font-size:13.5px;color:var(--encre2);margin-bottom:6px;line-height:1.45}
.fiche .secu{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--orange-p);color:#6B3408;font-size:13px}
.fiche .secu b{display:block;margin-bottom:2px}

/* ── bilan, semaine, saison ─────────────────────────────────────── */
.bl{border-left:3px solid #C2C8CC;padding-left:12px;margin-top:12px}
.bl.ok{border-color:var(--vert)}
.bl.warn{border-color:var(--orange)}
.bl b{font-size:13px}
.bl p{font-size:13px;color:var(--encre2);margin-top:1px}
.bl p b{color:var(--encre)}
.lst{list-style:none;margin:4px 0 0;padding:0}
.lst li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:3px 0;font-size:13px;color:var(--encre2)}
.lst li span{min-width:0}
.lst li b{flex:none;font-weight:600;color:var(--encre);font-variant-numeric:tabular-nums;text-align:right}
.lst+p{margin-top:6px}
.bilan .ghost,.bilan .cta{margin-top:14px}
.semrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--trait);
font-size:14px;cursor:pointer}
.sem h3+.semrow{border-top:0}
.semrow i{font-size:13px;color:var(--acier);text-align:right}
.semrow.open i{color:var(--encre);font-weight:650}
.semopts{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 4px}
.semopts+.ghost{margin-bottom:10px}
.dette{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-left:3px solid var(--orange);padding-left:12px;margin-bottom:10px}
.dette p{flex:1 1 100%;font-size:13px;color:var(--encre2)}
.sais{border-left:4px solid var(--rouge)}
.sais p{font-size:13.5px;color:var(--encre2)}
.saisrow,.line{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--trait)}
.saisrow:first-child,.line:first-child{border-top:0}
.saisrow b{font-size:14px;color:var(--acier);font-weight:600}
.saisrow small,.line small{display:block;font-size:12px;color:var(--acier)}
.saisrow i{font-size:12px;color:var(--acier);flex:none}
.saisrow.on b,.saisrow.evt b{color:var(--encre)}
.saisrow.on i{color:var(--rouge);font-weight:700}
.saisrow.evt i{border:1px solid var(--trait);border-radius:99px;padding:2px 8px}
.line b{font-size:14px;font-weight:600}

/* ── chrono : la barre de repos ─────────────────────────────────── */
#chrono{display:none}
#chrono.on{display:flex;align-items:center;gap:8px;position:fixed;left:10px;right:10px;z-index:10;
bottom:calc(68px + env(safe-area-inset-bottom));padding:8px 8px 8px 14px;border-radius:18px;color:var(--fonte);
background:linear-gradient(90deg,#DFA500 var(--p,0%),var(--jaune) var(--p,0%));box-shadow:0 8px 22px rgba(21,25,28,.25);
max-width:540px;margin:0 auto}
#chrono b{font:800 32px/1 var(--d);min-width:66px;font-variant-numeric:tabular-nums}
#chrono span{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chrono button{flex:none;width:42px;height:42px;border-radius:13px;background:rgba(28,32,36,.13);font-size:13px;font-weight:700}
#chrono.pause{background:var(--fonte);color:var(--clair)}
#chrono.pause button{background:rgba(255,255,255,.14)}
#chrono.fini{background:var(--vert);color:#fff}
#chrono.fini button{background:rgba(255,255,255,.2)}
#chrono.fini b{animation:cl .8s steps(1) infinite}
@keyframes cl{50%{opacity:.4}}
body.ch{padding-bottom:calc(144px + env(safe-area-inset-bottom))}
/* sur l'onglet Chrono, le grand affichage suffit */
body[data-tab=chrono] #chrono.on{display:none}
body[data-tab=chrono].ch{padding-bottom:calc(78px + env(safe-area-inset-bottom))}

/* ── navigation ─────────────────────────────────────────────────── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:4px;background:var(--carte);border-top:1px solid var(--trait);
padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:12px;
font-size:11px;font-weight:600;color:var(--acier)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--encre);background:#ECEFEF}

/* ── questionnaire d'accueil (nouveaux utilisateurs seulement) ──── */
.onb{position:fixed;inset:0;z-index:40;background:var(--fonte);color:var(--clair);overflow-y:auto;
padding:calc(22px + env(safe-area-inset-top)) 20px calc(26px + env(safe-area-inset-bottom))}
.onbin{max-width:460px;margin:0 auto}
.onbp{display:flex;gap:4px;margin-bottom:26px}
.onbp i{flex:1;height:4px;border-radius:2px;background:var(--fonte3)}
.onbp i.on{background:var(--jaune)}
.onb h1{font:800 36px/1.02 var(--d);margin:0 0 10px}
.onb .sub{font-size:14px;color:#C9CFD3;margin-bottom:22px}
.onb .ch{display:block;width:100%;text-align:left;background:var(--fonte2);border:1px solid var(--fonte3);
border-radius:14px;padding:14px 16px;margin-bottom:8px}
.onb .ch b{display:block;font-size:15px;color:#fff}
.onb .ch small{display:block;font-size:12.5px;color:var(--clair2);margin-top:2px;line-height:1.4}
.onb .ch.on{background:var(--clair);border-color:var(--clair)}
.onb .ch.on b{color:var(--fonte)}
.onb .ch.on small{color:var(--encre2)}
.onb .nav2{display:flex;gap:8px;margin-top:22px}
.onb .cta{background:var(--clair);color:var(--fonte);margin-top:0}
.onb .recap+.cta{margin-top:6px}
.onb .back{flex:0 0 96px;border:1px solid var(--fonte3);color:var(--clair);border-radius:12px;font-size:14px;font-weight:600;
background:transparent;padding:13px 0}
.onb .back.cta{display:block;width:100%;padding:13px}
.onb .recap,.onb .card{background:var(--fonte2);border:1px solid var(--fonte3);border-radius:14px;padding:6px 16px;margin-bottom:12px}
.onb .card{padding:12px 16px}
.onb .row{color:var(--clair2);border-top:1px solid var(--fonte3);padding:10px 0;align-items:baseline}
.onb .card .row{border:0;padding:0;align-items:center}
.onb .row:first-child{border-top:0}
.onb .row small{font-size:12.5px;color:var(--clair2);flex:none}
.onb .row b{color:#fff;font-size:14px;text-align:right}
.onb .step{background:var(--fonte);border-color:var(--fonte3)}
.onb .step .qty{color:#fff}
.onb .step button,.onb .step .un{color:var(--clair2)}
.onb .skip{display:block;width:100%;text-align:center;font-size:13px;color:var(--clair2);padding:16px 0 0;text-decoration:underline}
body.onbon header,body.onbon main,body.onbon nav,body.onbon #chrono{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="head"></header>
<main id="main"></main>
<div id="chrono"></div>
<nav id="nav"></nav>
<div id="onb"></div>
<!-- Le ?v= force le téléphone à retélécharger les scripts au lieu de ressortir
     ceux qu'il a en cache. À incrémenter en même temps que VERSION dans data.js. -->
<script src="data.js?v=50"></script>
<script src="anat.js?v=50"></script>
<script src="mouv.js?v=50"></script>
<script src="app.js?v=50"></script>
<script src="onb.js?v=50"></script>
<script src="ui.js?v=50"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
