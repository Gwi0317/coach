<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EBECE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#EBECE6;--card:#fff;--ink:#15171C;--ink2:#4A4F59;--mut:#8A8F99;--line:#DBDCD4;
--gym:#D8412A;--run:#1D5FA8;--nut:#1C6B4A;--wgt:#6B3FA0;--shop:#9A6A0B;--warn:#B4540A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,"SF Pro Text",system-ui,-apple-system,sans-serif;
padding-bottom:calc(72px + env(safe-area-inset-bottom))}
b,h1,h2,h3{font-weight:650}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
i{font-style:normal}
.num,.big,.kg,.kcal,.step b,.days button,.macros b,.spark+.ends{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
padding:calc(12px + env(safe-area-inset-top)) 16px 0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.hrow b{font-size:15px;letter-spacing:-.02em}
.hrow b span{color:var(--mut);font-weight:400}
.hrow i{font-size:12px;color:var(--mut)}
.days{display:flex;gap:4px;padding-bottom:10px}
.days button{flex:1;padding:7px 0;border-radius:3px;font-size:12px;color:var(--ink2);border:1px solid transparent}
.days button.on{background:var(--ink);color:#fff;font-weight:700}
.days button.miss{color:var(--gym)}

main{padding:16px;max-width:560px;margin:0 auto}
h2{font-size:13px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-bottom:6px;overflow:hidden}
.pad{padding:14px}
.note{border-left:2px solid var(--mut);padding:8px 0 8px 12px;margin:0 0 18px;font-size:13px;color:var(--ink2)}
.note.warn{border-color:var(--warn)}.note.run{border-color:var(--run)}.note.nut{border-color:var(--nut)}
.small{font-size:12.5px;color:var(--ink2);margin:10px 0 0}
.small.warn,.warn{color:var(--warn)}.ok{color:var(--nut)}
.grow{flex:1;min-width:0}

.hero{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:4px;padding:16px;margin-bottom:16px}
.hero.gym{border-left-color:var(--gym)}.hero.run{border-left-color:var(--run)}
.hero.nut{border-left-color:var(--nut)}.hero.wgt{border-left-color:var(--wgt)}.hero.shop{border-left-color:var(--shop)}
.hero small{font-size:11px;font-weight:600;color:var(--mut)}
.hero.gym small{color:var(--gym)}.hero.run small{color:var(--run)}.hero.wgt small{color:var(--wgt)}.hero.shop small{color:var(--shop)}
.hero h1{font-size:21px;letter-spacing:-.03em;margin:3px 0 0}
.hero p{font-size:13px;color:var(--ink2);margin:8px 0 0}
.pair{display:flex;gap:22px;margin-top:12px}
.pair small{display:block;font-size:11px;color:var(--mut)}
.pair b{font-size:14.5px}

.duo{display:flex;gap:8px;margin-bottom:16px}
.tog{flex:1;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink2);font-size:12.5px;font-weight:600}
.tog.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tog.danger.on{background:var(--gym);border-color:var(--gym)}
.phases{margin:14px 0 0}
.tog.full{display:block;width:100%;margin-bottom:16px}
.duo.wrap{flex-wrap:wrap;margin:6px 0 0}
.duo.wrap .tog{flex:1 1 40%;padding:8px;font-size:12px}
.vars{padding:10px 0 4px;border-top:1px solid var(--line);margin-top:8px}
.vars small{font-size:11.5px;color:var(--mut)}
.cta{display:block;width:100%;margin-top:12px;padding:11px;border-radius:3px;background:var(--ink);color:#fff;font-size:13px;font-weight:650}
.cta.gym{background:var(--gym)}.cta.run{background:var(--run)}.cta.nut{background:var(--nut)}.cta.wgt{background:var(--wgt)}
.ghost{display:block;width:100%;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:3px;color:var(--ink2);font-size:12.5px;background:var(--card)}
.ghost.danger{color:var(--gym);border-color:var(--gym)}

.exhead,.mhead,.line,.item{display:flex;align-items:center;gap:11px;padding:12px 14px}
.line{border-top:1px solid var(--line)}.card .line:first-child{border-top:none}
.exhead small,.mhead small,.item small,.line small{display:block;font-size:11.5px;color:var(--mut)}
.exhead b,.mhead b,.item b,.line b{font-size:13.5px}
.idx{font-size:11px;color:var(--mut);width:12px}
.kg{text-align:right;font-size:17px;font-weight:700}
.kg.ok{color:var(--nut)}
.kg i{font-size:11px;font-weight:500;color:var(--mut);margin-left:2px}
.kg small{font-size:10.5px;color:var(--nut)}
.kcal{font-size:16px;font-weight:700}
.obj{padding:0 14px 11px 37px;font-size:11.5px;color:var(--ink2);line-height:1.45}
.obj b{font-size:11.5px;color:var(--ink)}
.obj .prev{display:block;color:var(--mut)}
.exbody,.mbody{border-top:1px solid var(--line);padding:14px;background:#FAFAF7}
.exbody>small{font-size:11.5px;color:var(--mut)}
.sets{margin:8px 0 12px}
.set{display:flex;align-items:center;gap:8px;padding:5px 0}
.set .sn{width:16px;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.set .x{color:var(--mut);font-size:12px}
.set .step{flex:1}
.set .qty{flex:1;width:auto;text-align:center}
.set .pdc{flex:1;font-size:12px;color:var(--mut)}
.reps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.rep,.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:3px;background:var(--card)}
.rep button,.step button{padding:7px 10px;color:var(--mut);font-size:15px;line-height:1}
.rep b{min-width:34px;text-align:center;font-size:15px}
.step .qty{width:52px;border:none;background:none;text-align:right;font:inherit;font-size:15px;font-weight:650;
color:var(--ink);padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.step .qty::-webkit-outer-spin-button,.step .qty::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.step .un{font-size:11px;color:var(--mut);padding:0 4px 0 2px}
.bilan{border-left:3px solid var(--wgt);margin-bottom:18px}
.bilan h3{font-size:13px;margin:0 0 8px}
.bilan ul{margin:0;padding-left:16px}
.bilan li{font-size:12.5px;color:var(--ink2);margin-bottom:5px}
#bc,#ma,#mq{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font:inherit;font-size:13px;outline:none;margin-bottom:6px}
.cta.shop{background:var(--shop)}
.rep b.ok{color:var(--nut)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:12.5px;color:var(--ink2)}
.row.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.row.tot b{font-size:18px;color:var(--ink)}
.item{border-top:1px solid var(--line);padding:10px 0}
.mbody .item:first-child{border-top:none}
.del{color:var(--mut);padding:6px 2px}

.big{font-size:30px;font-weight:700}
.big small{font-size:13px;color:var(--mut);font-weight:400;margin-left:8px}
.bar{height:4px;background:#EDEDE7;border-radius:2px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:4px}
.macros{display:flex;justify-content:space-between}
.macros small{display:block;font-size:11px;color:var(--mut)}
.macros b{font-size:15px}
.macros i{font-size:11px;color:var(--mut);font-weight:400}

.cb{width:19px;height:19px;border-radius:3px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
font-size:12px;color:#fff;flex:0 0 auto}
.line i{font-size:12.5px;color:var(--ink2)}
.tag{border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-size:11px;color:var(--mut);margin-left:8px;flex:0 0 auto}
.line .done,.grow.done{color:var(--mut);text-decoration:line-through}

.picker input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:3px;font:inherit;font-size:13px;outline:none;margin-bottom:6px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.opt small{color:var(--mut);font-size:12px}

.spark{width:100%;height:92px;display:block}
.spark polyline{fill:none;stroke:var(--wgt);stroke-width:1.6}
.spark circle{fill:var(--wgt)}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.sem{border-left:3px solid var(--ink);margin-bottom:16px}
.sem h3{font-size:13px;margin:0 0 8px}
.semrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.semrow:first-of-type{border-top:none}
.semrow.open{font-weight:650}
.semrow i{font-size:12px;color:var(--mut)}
.semrow.open i{color:var(--gym)}
.exedit{display:flex;gap:4px;margin-left:8px}
.exedit button{width:30px;height:30px;border:1px solid var(--line);border-radius:3px;color:var(--mut);font-size:13px}
.addex{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.addex .tog{flex:1 1 45%;padding:8px 6px;font-size:11.5px}
.prop{border-left:3px solid var(--nut);margin-bottom:14px}
.prop h3{font-size:13px;margin:0 0 10px}
.propline{border-top:1px solid var(--line);padding:9px 0;font-size:13px}
.prop .propline:first-of-type{border-top:none}
.propline .small{display:block;color:var(--mut);margin:2px 0 6px}
.propbtn{display:flex;gap:6px}
.propbtn .tog{flex:0 0 72px;padding:7px 0;font-size:12px}
.nw{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:-2px 0 14px}
.nw .small{margin:0;flex:1;text-align:left}
.nwb{width:auto;margin:0;padding:8px 14px;font-size:12px;border-radius:3px}
.dette{border-left:2px solid var(--gym);padding:8px 0 8px 10px;margin-bottom:10px;font-size:12.5px;color:var(--ink2)}
.dette .ghost{display:inline-block;width:auto;margin:6px 6px 0 0;padding:6px 10px}
.semopts{display:flex;flex-wrap:wrap;gap:5px;padding:4px 0 8px}
.semopts .tog{flex:1 1 30%;padding:7px 4px;font-size:11.5px}
.replan{border-left:3px solid var(--warn)}
.replan h3{font-size:12.5px;margin:0 0 6px}
.replan p{font-size:12.5px;color:var(--ink2);margin:0}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:9}
nav button{flex:1;font-size:11px;color:var(--mut);padding:4px 0}
nav button.on{color:var(--ink);font-weight:650}
</style>
</head>
<body>
<header id="head"></header>
<main id="main"></main>
<nav id="nav"></nav>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
